# Tronyi 远程桌面 —— 自建 RustDesk 信令(hbbs) + 中继(hbbr)服务器
#
# 用法（在服务器本目录下）：
#   1) 复制 .env.example 为 .env，按需改 RELAY_IP
#   2) docker compose up -d
#   3) docker compose logs -f      # 首次启动会生成密钥，留意日志
#
# 前置：阿里云安全组需放行 TCP 21115-21119 与 UDP 21116（详见同目录 README.md）。
# 说明：使用 host 网络模式，端口直接开在宿主机，无需 -p 映射。

services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: hbbs
    command: hbbs -r ${RELAY_IP}:21117
    network_mode: host
    volumes:
      - ./data:/root
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: hbbr
    command: hbbr
    network_mode: host
    volumes:
      - ./data:/root
    restart: unless-stopped
